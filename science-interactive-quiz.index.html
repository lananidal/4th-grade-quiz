<style>
/* Layout: sticky top bar (title, stars, sound), numbered jump buttons, one big question card (picture left, question + A-D choices right), Previous / Next at the bottom. One bright look matching the Grade 4 lesson slides. */
:root {
  --navy: #1F2A44;
  --paper: #FFF8EC;
  --sun: #F5B83D;
  --blue: #2467B8;
  --teal: #0F766E;
  --amber: #B45309;
  --berry: #BE123C;
  --good: #15803D;
  --good-tint: #D9F4DF;
  --bad-tint: #FADADD;
  --line: #E6DCC8;
  --font-display: "Fredoka", "Trebuchet MS", Verdana, sans-serif;
  --font-body: "Nunito", Verdana, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--navy);
  font-family: var(--font-body);
  font-weight: 700;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; background: var(--navy); color: var(--paper); border-radius: 24px; padding: 16px 24px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { width: 48px; height: 48px; flex: none; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 5vw, 40px); line-height: 1.05; text-wrap: balance; }
.brand small { display: block; font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--sun); }
.top-right { display: flex; align-items: center; gap: 12px; }
.score { background: var(--sun); color: var(--navy); font-family: var(--font-display); font-weight: 600; font-size: 28px; padding: 8px 20px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mute { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--paper); background: transparent; color: var(--paper); display: grid; place-items: center; }
.mute svg { width: 28px; height: 28px; }
.mute[aria-pressed="true"] { background: var(--paper); color: var(--navy); }

.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 48px; height: 48px; border-radius: 14px; border: 3px solid var(--line); background: #fff; font-family: var(--font-display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; position: relative; }
.dot.first { background: var(--good); border-color: var(--good); color: #fff; }
.dot.late { background: var(--sun); border-color: var(--sun); color: var(--navy); }
.dot.here { box-shadow: 0 0 0 4px var(--blue); border-color: var(--navy); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 16px; color: #465069; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 18px; border-radius: 6px; display: inline-block; border: 2px solid var(--line); background: #fff; }
.legend i.g { background: var(--good); border-color: var(--good); }
.legend i.y { background: var(--sun); border-color: var(--sun); }

.card { background: #fff; border: 3px solid var(--line); border-radius: 32px; padding: clamp(16px, 3vw, 36px); display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: clamp(16px, 3vw, 40px); align-items: start; }
.stage { border-radius: 28px; aspect-ratio: 1; display: grid; place-items: center; text-align: center; line-height: 1; font-size: clamp(110px, 20vw, 200px); user-select: none; padding: 12px; }
.stage.two { font-size: clamp(70px, 12vw, 120px); letter-spacing: 6px; }
.qside { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.qnum { align-self: flex-start; background: var(--navy); color: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 22px; padding: 6px 18px; border-radius: 999px; }
.question { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 4.2vw, 44px); line-height: 1.2; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.choice { display: flex; align-items: center; gap: 16px; text-align: left; border: 4px solid transparent; border-radius: 22px; padding: 14px 18px; font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1.2; min-height: 92px; min-width: 0; transition: transform .12s; }
.choice:hover:not(:disabled) { transform: translateY(-3px); }
.choice .badge { flex: none; width: 56px; height: 56px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 32px; }
.choice .txt { min-width: 0; overflow-wrap: anywhere; }
.c0 { background: #D6E8FA; } .c0 .badge { background: var(--blue); }
.c1 { background: #CDEDE8; } .c1 .badge { background: var(--teal); }
.c2 { background: #FFE2B8; } .c2 .badge { background: var(--amber); }
.c3 { background: #FADADD; } .c3 .badge { background: var(--berry); }
.choice.right { background: var(--good-tint); border-color: var(--good); }
.choice.right .badge { background: var(--good); }
.choice.wrong { background: #F3F0EA; border-color: var(--berry); color: #6b5b60; text-decoration: line-through; text-decoration-thickness: 3px; animation: shake .4s; }
.choice.wrong .badge { background: #8a7f84; }
.choice:disabled { cursor: default; }
.choice:disabled:not(.right):not(.wrong) { opacity: .55; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }

.feedback { min-height: 76px; border-radius: 20px; padding: 14px 20px; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.3; display: flex; align-items: center; gap: 14px; }
.feedback.hint { background: #F3F0EA; color: #465069; }
.feedback.ok { background: var(--good-tint); color: #0B4A22; }
.feedback.no { background: var(--bad-tint); color: #7A0B25; }
.feedback b { font-family: var(--font-display); font-weight: 600; font-size: 1.15em; }

.nav { display: flex; justify-content: space-between; gap: 16px; }
.nav button { font-family: var(--font-display); font-weight: 600; font-size: 28px; padding: 16px 32px; border-radius: 999px; border: 4px solid var(--navy); background: #fff; min-width: 160px; }
.nav button.next { background: var(--navy); color: var(--paper); }
.nav button.pulse { animation: pulse 1s ease-in-out infinite; }
.nav button:disabled { opacity: .35; cursor: default; }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }

.done { background: var(--navy); color: var(--paper); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
.done h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 6vw, 56px); line-height: 1.1; color: var(--sun); text-wrap: balance; }
.done p { margin: 0; font-size: clamp(20px, 3vw, 30px); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (max-width: 760px) {
  .card { grid-template-columns: minmax(0, 1fr); }
  .stage { aspect-ratio: auto; min-height: 190px; }
  .nav button { min-width: 0; flex: 1; padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .choice.wrong, .nav button.pulse { animation: none; }
  .choice { transition: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,1.5 15.2,8.6 22.5,9.2 17,14.2 18.7,22 12,18 5.3,22 7,14.2 1.5,9.2 8.8,8.6" fill="#F5B83D" stroke="#F5B83D" stroke-width="1" stroke-linejoin="round"></polygon></svg>
      <div><small>Grade 4 · Science</small><h1>Science Interactive Quiz</h1></div>
    </div>
    <div class="top-right">
      <div class="score" id="score" aria-live="polite">Stars: 0 / 20</div>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Sound on. Tap to mute.">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
      </button>
    </div>
  </header>

  <nav class="jump" id="jump" aria-label="Jump to a question"></nav>
  <div class="legend"><span><i class="g"></i>Right on the first try</span><span><i class="y"></i>Right after trying again</span><span><i></i>Not answered yet</span></div>

  <main class="card" id="card">
    <div class="stage" id="stage" aria-hidden="true"></div>
    <div class="qside">
      <div class="qnum" id="qnum"></div>
      <h2 class="question" id="question"></h2>
      <div class="choices" id="choices"></div>
      <div class="feedback hint" id="feedback" role="status" aria-live="polite"></div>
    </div>
  </main>

  <div class="nav">
    <button type="button" id="prev">← Back</button>
    <button type="button" id="next" class="next">Next →</button>
  </div>

  <section class="done" id="done" hidden>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
  </section>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

    { pic: "⚖️", bg: "#E5DBF7", q: "What does mass tell us?", o: ["How much matter is in something", "How much space it takes up", "How hot it is", "How fast it moves"], a: 0, e: "Mass is how much matter is in something. We measure it in grams (g) and kilograms (kg)." },
    { pic: "🐭 🦏", two: true, bg: "#CDEDE8", q: "A mouse has a small mass. Which one has a big mass?", o: ["A feather", "A paper clip", "A leaf", "A rhino"], a: 3, e: "A rhino has a big mass. It has a lot of matter inside. We measure mass in grams (g) and kilograms (kg)." },
    { pic: "⚽ 🎳", two: true, bg: "#FFE2B8", q: "A football and a bowling ball have the same volume. Which one has more mass?", o: ["The football", "The bowling ball", "They are the same", "Neither"], a: 1, e: "They take up the same space, but the bowling ball has more matter inside." },
    { pic: "🪨", bg: "#D6E8FA", q: "A stone pushes the water in a cylinder up from 100 ml to 130 ml. What is the volume of the stone?", o: ["100 ml", "130 ml", "30 ml", "230 ml"], a: 2, e: "130 − 100 = 30 ml. The stone pushes the water out of its way." },
    { pic: "🥛", bg: "#CDEDE8", q: "Which one takes the shape of its container?", o: ["A liquid", "A solid", "A brick", "A spring"], a: 0, e: "A liquid changes shape easily. It takes the shape of its container." },
    { pic: "🎈", bg: "#FADADD", q: "Which state of matter has particles far apart that spread out to fill all the space?", o: ["Solid", "Liquid", "Ice", "Gas"], a: 3, e: "In a gas the particles are far apart and move freely. A gas spreads out." }
  ];
  var L = ["A", "B", "C", "D"];
  var N = Q.length;
  var S = Q.map(function () { return { wrong: [], solved: false, first: false }; });
  var cur = 0, muted = false, ctx = null, finished = false;

  var $ = function (id) { return document.getElementById(id); };
  var jump = $("jump"), stage = $("stage"), qnum = $("qnum"), question = $("question"),
      choices = $("choices"), feedback = $("feedback"), prev = $("prev"), next = $("next"),
      score = $("score"), done = $("done");

  /* ---------- number buttons ---------- */
  Q.forEach(function (_, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "dot"; b.textContent = i + 1;
    b.setAttribute("aria-label", "Go to question " + (i + 1));
    b.addEventListener("click", function () { go(i); });
    jump.appendChild(b);
  });

  function go(i) { cur = Math.max(0, Math.min(N - 1, i)); render(); }

  /* ---------- render ---------- */
  function render() {
    var q = Q[cur], s = S[cur];
    if (q.svg) stage.innerHTML = q.svg; else stage.textContent = q.pic;
    stage.className = "stage" + (q.two ? " two" : "");
    stage.style.background = q.bg;
    qnum.textContent = "Question " + (cur + 1) + " of " + N;
    question.textContent = q.q;

    choices.innerHTML = "";
    q.o.forEach(function (txt, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice c" + i;
      var isWrong = s.wrong.indexOf(i) > -1;
      if (isWrong) b.className += " wrong";
      if (s.solved && i === q.a) b.className += " right";
      b.disabled = s.solved || isWrong;
      b.setAttribute("aria-label", L[i] + ": " + txt);
      b.innerHTML = '<span class="badge" aria-hidden="true">' + L[i] + '</span><span class="txt"></span>';
      b.lastChild.textContent = txt;
      b.addEventListener("click", function () { pick(i); });
      choices.appendChild(b);
    });

    if (s.solved) {
      feedback.className = "feedback ok";
      feedback.innerHTML = "<span><b>" + (s.first ? "Yes! Great job!" : "That’s it! Well done!") + "</b> " + q.e + "</span>";
    } else if (s.wrong.length) {
      feedback.className = "feedback no";
      feedback.innerHTML = "<span><b>Not quite.</b> Try another answer!</span>";
    } else {
      feedback.className = "feedback hint";
      feedback.innerHTML = "<span>Tap A, B, C or D to answer.</span>";
    }

    prev.disabled = cur === 0;
    next.disabled = cur === N - 1;
    next.className = "next" + (s.solved && cur < N - 1 ? " pulse" : "");

    var dots = jump.children, stars = 0;
    for (var i = 0; i < N; i++) {
      var d = dots[i], st = S[i];
      var cls = "dot" + (st.solved ? (st.first ? " first" : " late") : "") + (i === cur ? " here" : "");
      d.className = cls;
      if (i === cur) d.setAttribute("aria-current", "true"); else d.removeAttribute("aria-current");
      if (st.first) stars++;
    }
    score.textContent = "Stars: " + stars + " / " + N;

    var all = S.every(function (x) { return x.solved; });
    done.hidden = !all;
    if (all) {
      $("doneTitle").textContent = stars === N ? "Perfect! You are a Science Star!" : "You finished the quiz!";
      $("doneText").textContent = "You got " + stars + " out of " + N + " on the first try. You can go back to any question to review.";
    }
  }

  /* ---------- answering ---------- */
  function pick(i) {
    var q = Q[cur], s = S[cur];
    if (s.solved || s.wrong.indexOf(i) > -1) return;
    if (i === q.a) {
      s.solved = true;
      s.first = s.wrong.length === 0;
      render();
      var all = S.every(function (x) { return x.solved; });
      if (all && !finished) { finished = true; cheer(true); burst(true); }
      else { cheer(false); burst(false); }
    } else {
      s.wrong.push(i);
      oops();
      render();
    }
  }

  prev.addEventListener("click", function () { go(cur - 1); });
  next.addEventListener("click", function () { go(cur + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright") go(cur + 1);
    else if (k === "arrowleft") go(cur - 1);
    else if ("abcd".indexOf(k) > -1 && k.length === 1) pick("abcd".indexOf(k));
  });

  /* ---------- sound (made in the browser, no files) ---------- */
  function audio() {
    if (muted) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function tone(freq, t0, dur, type, gain) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function pop(t0, vol) {
    var len = Math.floor(ctx.sampleRate * 0.25), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = "highpass"; f.frequency.value = 1800; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t0);
  }
  function cheer(big) {
    var c = audio(); if (!c) return;
    var t = c.currentTime + 0.02;
    pop(t, 0.5);
    var notes = big ? [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1568] : [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach(function (n, i) {
      tone(n, t + 0.05 + i * 0.09, 0.28, "triangle", 0.22);
      tone(n * 2, t + 0.05 + i * 0.09, 0.18, "sine", 0.06);
    });
    var end = t + 0.05 + notes.length * 0.09;
    tone(1046.5, end, big ? 0.9 : 0.5, "triangle", 0.2);
    tone(1318.5, end, big ? 0.9 : 0.5, "triangle", 0.16);
    tone(1568, end, big ? 0.9 : 0.5, "triangle", 0.12);
    pop(t + 0.3, 0.3);
    if (big) { pop(t + 0.7, 0.35); pop(t + 1.1, 0.3); }
  }
  function oops() {
    var c = audio(); if (!c) return;
    var t = c.currentTime + 0.01;
    tone(300, t, 0.18, "sine", 0.18);
    tone(220, t + 0.14, 0.26, "sine", 0.18);
  }
  $("mute").addEventListener("click", function () {
    muted = !muted;
    this.setAttribute("aria-pressed", muted ? "true" : "false");
    this.setAttribute("aria-label", muted ? "Sound off. Tap to turn on." : "Sound on. Tap to mute.");
    $("muteIcon").innerHTML = muted
      ? '<path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M17 9l5 6"></path><path d="M22 9l-5 6"></path>'
      : '<path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path>';
    if (!muted) cheer(false);
  });

  /* ---------- confetti ---------- */
  var cv = $("confetti"), cx = cv.getContext("2d"), parts = [], raf = 0;
  var COLORS = ["#F5B83D", "#2467B8", "#0F766E", "#BE123C", "#B45309", "#15803D", "#7C3AED", "#FF6FA5"];
  function size() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener("resize", size); size();
  function burst(big) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var n = big ? 320 : 150, w = cv.width, h = cv.height;
    for (var i = 0; i < n; i++) {
      var fromLeft = i % 2 === 0;
      var x = big ? Math.random() * w : (fromLeft ? w * 0.2 : w * 0.8);
      var y = big ? -20 : h * 0.55;
      var ang = big ? Math.PI / 2 + (Math.random() - 0.5) : (fromLeft ? -1.1 : -Math.PI + 1.1) + (Math.random() - 0.5) * 0.9;
      var sp = big ? 3 + Math.random() * 5 : 9 + Math.random() * 11;
      parts.push({
        x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        s: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        c: COLORS[(Math.random() * COLORS.length) | 0], star: Math.random() < 0.2, life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(function (p) { return p.y < cv.height + 30 && p.life < 260; });
    parts.forEach(function (p) {
      p.life++; p.vy += 0.28; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      if (p.star) {
        cx.beginPath();
        for (var k = 0; k < 10; k++) { var rad = k % 2 ? p.s * 0.45 : p.s; var a = k * Math.PI / 5; cx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
        cx.closePath(); cx.fill();
      } else { cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      cx.restore();
    });
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; cx.clearRect(0, 0, cv.width, cv.height); }
  }

  render();
})();
</script>
